<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Pager test</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Diagnostic for the app's tab pager on the iPhone (2026-11-12). Four small
     copies of its structure, one per row; each says by itself whether its
     second page scrolled up and down and whether its orange box turned without
     moving the cards. Delete once the pager is settled. -->
<style>
html,body{height:100%;overflow:hidden;margin:0;font-family:-apple-system,sans-serif;background:#dfe7f2;color:#12254a}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;padding:6px}
.row{position:relative;flex:1;min-height:0;border-radius:12px;overflow:hidden;background:#fff}
.lab{position:absolute;left:6px;top:4px;z-index:5;font:700 11px/1.3 -apple-system;background:#12254ae6;color:#fff;border-radius:6px;padding:3px 6px;pointer-events:none}
.res{position:absolute;right:6px;top:4px;z-index:5;font:800 12px/1.3 -apple-system;background:#fff;border:2px solid #12254a;border-radius:6px;padding:2px 6px;pointer-events:none}
.tp{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior:contain;scrollbar-width:none}
.p{position:relative;flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.L .p{transform:translateZ(0)}
.C .p{contain:layout}
.s{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:none;display:flex;flex-direction:column;background:#e9eff7}
.s::before{content:'';flex:0 0 26px}
.it{margin:4px 10px;background:#fff;border-radius:8px;padding:10px;font-weight:700;font-size:13px;flex:none}
.deck{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 40px;overscroll-behavior-x:contain;flex:none}
.card{flex:0 0 200px;height:110px;border-radius:14px;background:#bfe3ff;scroll-snap-align:center;position:relative;font:700 11px -apple-system;padding:6px;box-sizing:border-box}
.hold{position:absolute;left:60px;top:22px;width:80px;height:80px;border:2px dashed #f09800;touch-action:none;border-radius:10px;display:none;place-items:center;font-size:12px;font-weight:800;color:#b06a00}
.B .hold{background:rgba(255,255,255,.004)}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
// A: the app as it is (contain: layout), page 2 and the box arrive late.
// B: A plus the two cures in the app since 2026-11-12 b.
// C: panels as layers (translateZ), late.
// D: like A, but everything there from the start.
var ROWS=[['A','C',true,false],['B','C B',true,true],['C','L',true,false],['D','C',false,false]];
ROWS.forEach(function(r){
  var name=r[0],cls=r[1],late=r[2],cure=r[3];
  var row=document.createElement('div');row.className='row '+cls;
  row.innerHTML='<div class="lab">'+name+'：拖橘框；在卡片下方往左滑到第 2 頁，再上下滑</div><div class="res">捲動 ✗　轉動 ✗</div>'+
   '<div class="tp"><section class="p"><div class="s"><div class="deck"><div class="card">第 1 頁 卡 1<div class="hold">轉我</div></div><div class="card">卡 2</div><div class="card">卡 3</div></div></div></section>'+
   '<section class="p"><div class="s s1"></div></section></div>';
  document.getElementById('wrap').appendChild(row);
  var s1=row.querySelector('.s1'),hold=row.querySelector('.hold'),deck=row.querySelector('.deck'),tp=row.querySelector('.tp'),res=row.querySelector('.res');
  function fill(){var h='<div class="it">第 2 頁（'+(late?'晚到':'一開始就有')+'）</div>';for(var i=1;i<=20;i++)h+='<div class="it">'+i+'</div>';s1.innerHTML=h}
  function show(){hold.style.display='grid'}
  if(late){setTimeout(fill,1500);setTimeout(show,1800)}else{fill();show()}
  var moves=0,deckAt=0,turnOk=false,scrollOk=false;
  hold.addEventListener('pointerdown',function(){moves=0;deckAt=deck.scrollLeft});
  hold.addEventListener('pointermove',function(){moves++});
  hold.addEventListener('pointerup',function(){if(moves>=5&&Math.abs(deck.scrollLeft-deckAt)<2)turnOk=true;upd()});
  hold.addEventListener('pointercancel',function(){upd()});
  s1.addEventListener('scroll',function(){if(s1.scrollTop>20)scrollOk=true;upd()},{passive:true});
  if(cure){ // the app's cure: the page coming on screen gets its scroller made again
    var t;tp.addEventListener('scroll',function(){clearTimeout(t);t=setTimeout(function(){if(Math.round(tp.scrollLeft/tp.clientWidth)===1){var y=s1.scrollTop;s1.style.overflowY='hidden';void s1.offsetHeight;s1.style.overflowY='';s1.scrollTop=y}},150)},{passive:true});
  }
  function upd(){res.textContent='捲動 '+(scrollOk?'✓':'✗')+'　轉動 '+(turnOk?'✓':'✗');res.style.borderColor=scrollOk&&turnOk?'#1a7f37':'#12254a'}
});
</script></body></html>
