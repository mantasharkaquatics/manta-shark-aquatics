<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Pager test</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{height:100%;overflow:hidden;margin:0;font-family:-apple-system,sans-serif}
.ab{position:fixed;top:8px;left:8px;right:8px;height:44px;background:#fff;border-radius:12px;z-index:60;box-shadow:0 2px 8px #0002;display:flex;align-items:center;padding:0 10px;font-weight:800;font-size:13px}
.tb{position:fixed;left:12px;right:12px;bottom:20px;height:56px;background:#fff;border-radius:28px;z-index:60;box-shadow:0 2px 8px #0003;display:flex;justify-content:space-around;align-items:center;font-size:12px}
.tp{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior:contain;scrollbar-width:none}
.tp-panel{position:relative;flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.va .tp-panel{transform:translateZ(0)}
.vb .tp-panel{contain:layout}
.tp-scroll{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:none;display:flex;flex-direction:column;padding-bottom:96px;background:#e9eff7}
.tp-scroll::before{content:'';flex:0 0 64px}
.row{margin:8px 14px;background:#fff;border-radius:12px;padding:22px 14px;font-weight:700}
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 32px;overscroll-behavior-x:contain}
.card{flex:0 0 260px;height:300px;border-radius:20px;background:#bfe3ff;scroll-snap-align:center;position:relative}
.hold{position:absolute;left:80px;top:70px;width:100px;height:150px;background:#f098004d;border:2px dashed #f09800;touch-action:none;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800}
.st{position:fixed;left:8px;right:8px;top:58px;z-index:70;background:#12254aee;color:#fff;font:12px/1.4 ui-monospace,monospace;padding:6px 8px;border-radius:8px;white-space:pre}
</style></head><body><!-- Diagnostic for the app tab pager on the iPhone (2026-11-12): open with #a (panels as layers, translateZ), #b (contain: layout, what the app uses now) or #c (neither). Delete once the pager is settled. -->
<div class="ab">PAGER TEST <span id="vn" style="margin-left:8px;color:#f09800"></span></div>
<div class="st" id="st">…</div>
<div class="tp" id="tp">
  <section class="tp-panel"><div class="tp-scroll" id="s0"><div class="row">首頁 panel 0</div>
    <div class="deck"><div class="card"><div class="hold" id="h1">TURN 1</div></div><div class="card"><div class="hold" id="h2">TURN 2</div></div><div class="card"><div class="hold" id="h3">TURN 3</div></div></div>
  </div></section>
  <section class="tp-panel"><div class="tp-scroll" id="s1"></div></section>
  <section class="tp-panel"><div class="tp-scroll" id="s2"><div class="row">panel 2</div></div></section>
</div>
<div class="tb"><span>首頁</span><span>預約</span><span>課表</span></div>
<script>
var v=(location.hash||'#a').slice(1);document.documentElement.className='v'+v;document.getElementById('vn').textContent='variant '+v;
var moves={h1:0,h2:0,h3:0};
['h1','h2','h3'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('pointermove',function(){moves[id]++;});});
// panel 1 content arrives later, while off screen (like 預約 loading in the background)
setTimeout(function(){var s=document.getElementById('s1');var h='<div class="row">預約 panel 1 (loaded late)</div>';for(var i=1;i<=25;i++)h+='<div class="row">row '+i+'</div>';s.innerHTML=h;},1500);
function upd(){document.getElementById('st').textContent='tp.left='+Math.round(document.getElementById('tp').scrollLeft)+'  s0='+Math.round(s0.scrollTop)+'  s1='+Math.round(s1.scrollTop)+'\nturn moves: 1='+moves.h1+' 2='+moves.h2+' 3='+moves.h3;requestAnimationFrame(upd)}
var s0=document.getElementById('s0'),s1=document.getElementById('s1');upd();
</script></body></html>
